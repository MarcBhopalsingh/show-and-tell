name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and to read the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Site identity. Set these as repository Variables
          # (Settings -> Secrets and variables -> Actions -> Variables).
          # If unset, the defaults in astro.config.mjs are used.
          SITE_AUTHOR: ${{ vars.SITE_AUTHOR }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
          SITE_EMAIL: ${{ vars.SITE_EMAIL }}
          SITE_GITHUB: ${{ vars.SITE_GITHUB }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
