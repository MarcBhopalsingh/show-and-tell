name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_AUTHOR: ${{ vars.SITE_AUTHOR }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
          SITE_EMAIL: ${{ vars.SITE_EMAIL }}
          SITE_GITHUB: ${{ vars.SITE_GITHUB }}
          SITE_LINKEDIN: ${{ vars.SITE_LINKEDIN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
